name: CI

on:
  push:
    branches: [ devel, main ]
  pull_request:
    branches: [ devel, main ]

jobs:
  validate:
    name: CI # required status check on main (repository rule)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run test suite
        run: npm test

      - name: Headless production build
        run: npm run build
