appId: dev.speckit.studio
productName: speckit studio
# Stable names (no version), so the README can link to releases/latest/download/<file>.
artifactName: ${name}-${os}-${arch}.${ext}
directories:
  buildResources: build
# Only the bundled app; tests, specs, the fake agent and sources stay out (FR-003).
files:
  - out/**
  - package.json
  - resources/icon.png # window icon on Windows/Linux
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip # required by electron-updater on macOS
      arch: [arm64, x64]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing uses the Developer ID certificate from the keychain (or CSC_LINK/CSC_KEY_PASSWORD).
  # Notarization runs when APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER (or APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID) are set.
win:
  target: nsis
linux:
  target: AppImage
  category: Development
npmRebuild: false
# Auto-update: add a publish target, e.g.
# publish:
#   provider: github
#   owner: <github-user>
#   repo: speckit-studio
