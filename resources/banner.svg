<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="bannerSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#0891b2" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Subtle Background Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
  </g>

  <!-- Cockpit Instrument Symbol (Left Side) -->
  <g transform="translate(180, 180)">
    <!-- Housing -->
    <circle cx="0" cy="0" r="130" fill="#090d16" stroke="#334155" stroke-width="4" />
    <circle cx="0" cy="0" r="120" fill="none" stroke="#1e293b" stroke-width="1.5" />

    <!-- Radar Range Rings -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="0" cy="0" r="65" fill="none" stroke="#334155" stroke-width="2" />
    <circle cx="0" cy="0" r="35" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Radar Sweep -->
    <path d="M 0,0 L 67,-67 A 95,95 0 0,1 92,25 Z" fill="url(#bannerSweep)" />
    <line x1="0" y1="0" x2="92" y2="25" stroke="#22d3ee" stroke-width="2" filter="url(#glow)" />

    <!-- Crosshair Reticle -->
    <line x1="0" y1="-120" x2="0" y2="120" stroke="#0e7490" stroke-width="1" opacity="0.6" />
    <line x1="-120" y1="0" x2="120" y2="0" stroke="#0e7490" stroke-width="1" opacity="0.6" />

    <!-- Degree Ticks -->
    <g stroke="#475569" stroke-width="1.5" opacity="0.7">
      <line x1="0" y1="-120" x2="0" y2="-112" />
      <line x1="0" y1="120" x2="0" y2="112" />
      <line x1="-120" y1="0" x2="-112" y2="0" />
      <line x1="120" y1="0" x2="112" y2="0" />
      <polygon points="0,-120 4,-110 -4,-110" fill="#38bdf8" />
    </g>

    <!-- Tracked Spec Blips -->
    <circle cx="48" cy="-35" r="5" fill="#22d3ee" filter="url(#glow)" />
    <circle cx="-50" cy="40" r="4.5" fill="#10b981" filter="url(#glow)" />
    <circle cx="55" cy="50" r="4" fill="#38bdf8" />

    <!-- Instrument Core -->
    <circle cx="0" cy="0" r="14" fill="#0b1329" stroke="#0284c7" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Typography & Text Content (Right Side) -->
  <g transform="translate(370, 0)">
    <!-- Category Tag -->
    <rect x="0" y="70" width="230" height="28" rx="6" fill="url(#badgeGrad)" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4" />
    <text x="12" y="89" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">SPEC-DRIVEN COCKPIT</text>

    <!-- Main Title -->
    <text x="0" y="152" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">SPECKIT STUDIO</text>

    <!-- Subtitle -->
    <text x="0" y="196" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="400">
      Local Desktop Cockpit for GitHub Spec Kit &amp; ACP Agents
    </text>

    <!-- Key Attributes List -->
    <g transform="translate(0, 240)">
      <!-- Pill 1: Local-Only -->
      <rect x="0" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#10b981" />
      <text x="28" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">Local Only</text>

      <!-- Pill 2: Agent Client Protocol -->
      <rect x="145" y="0" width="140" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="160" cy="15" r="4" fill="#38bdf8" />
      <text x="173" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">ACP Standard</text>

      <!-- Pill 3: Zero Cloud -->
      <rect x="300" y="0" width="130" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="315" cy="15" r="4" fill="#a855f7" />
      <text x="328" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">Zero Cloud</text>

      <!-- Pill 4: MIT Open Source -->
      <rect x="445" y="0" width="155" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="460" cy="15" r="4" fill="#06b6d4" />
      <text x="473" y="20" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500">MIT Open Source</text>
    </g>
  </g>
</svg>
